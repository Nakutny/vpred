<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="50" fill="#0a0e14"/>
  <!-- Vault body -->
  <rect x="18" y="22" width="64" height="56" rx="4" fill="#1c2333" stroke="#2d3a4f" stroke-width="2"/>
  <rect x="20" y="24" width="60" height="52" rx="3" fill="#18202e"/>
  <!-- Vault door texture lines -->
  <line x1="22" y1="30" x2="78" y2="30" stroke="#1f2940" stroke-width="0.8"/>
  <line x1="22" y1="70" x2="78" y2="70" stroke="#1f2940" stroke-width="0.8"/>
  <!-- Bolt holes top -->
  <circle cx="26" cy="27" r="2" fill="#0d1219" stroke="#2a3a50" stroke-width="0.8"/>
  <circle cx="74" cy="27" r="2" fill="#0d1219" stroke="#2a3a50" stroke-width="0.8"/>
  <!-- Bolt holes bottom -->
  <circle cx="26" cy="73" r="2" fill="#0d1219" stroke="#2a3a50" stroke-width="0.8"/>
  <circle cx="74" cy="73" r="2" fill="#0d1219" stroke="#2a3a50" stroke-width="0.8"/>
  <!-- Hinge -->
  <rect x="16" y="35" width="6" height="8" rx="1" fill="#2d3a4f" stroke="#3a4f6a" stroke-width="0.8"/>
  <rect x="16" y="57" width="6" height="8" rx="1" fill="#2d3a4f" stroke="#3a4f6a" stroke-width="0.8"/>
  <!-- Main dial outer ring -->
  <circle cx="52" cy="50" r="20" fill="#0d1219" stroke="#2d4060" stroke-width="2.5"/>
  <circle cx="52" cy="50" r="17" fill="#101827" stroke="#1e3050" stroke-width="1"/>
  <!-- Dial markings -->
  <line x1="52" y1="33" x2="52" y2="36" stroke="#4a6080" stroke-width="1.5"/>
  <line x1="52" y1="64" x2="52" y2="67" stroke="#4a6080" stroke-width="1.5"/>
  <line x1="35" y1="50" x2="38" y2="50" stroke="#4a6080" stroke-width="1.5"/>
  <line x1="66" y1="50" x2="69" y2="50" stroke="#4a6080" stroke-width="1.5"/>
  <!-- Small tick marks -->
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(30 52 50)"/>
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(60 52 50)"/>
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(120 52 50)"/>
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(150 52 50)"/>
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(210 52 50)"/>
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(240 52 50)"/>
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(300 52 50)"/>
  <line x1="52" y1="33" x2="52" y2="35" stroke="#2a4060" stroke-width="0.8" transform="rotate(330 52 50)"/>
  <!-- Inner dial -->
  <circle cx="52" cy="50" r="10" fill="#0a0e14" stroke="#1e3050" stroke-width="1"/>
  <!-- Dial handle/spoke -->
  <line x1="52" y1="50" x2="52" y2="41" stroke="#3a6090" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="50" x2="59" y2="54" stroke="#3a6090" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="50" x2="45" y2="54" stroke="#3a6090" stroke-width="2" stroke-linecap="round"/>
  <!-- Center hub -->
  <circle cx="52" cy="50" r="3.5" fill="#1e3050" stroke="#3a6090" stroke-width="1"/>
  <circle cx="52" cy="50" r="1.5" fill="#4f8ef7"/>
  <!-- Handle bar -->
  <rect x="71" y="47" width="8" height="6" rx="2" fill="#2d3a4f" stroke="#3a5070" stroke-width="0.8"/>
  <circle cx="75" cy="50" r="2" fill="#1a2535"/>
</svg>
