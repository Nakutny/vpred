<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#111418"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a7a8a"/>
      <stop offset="25%" stop-color="#8a9aaa"/>
      <stop offset="50%" stop-color="#5a6a7a"/>
      <stop offset="75%" stop-color="#7a8a9a"/>
      <stop offset="100%" stop-color="#4a5a6a"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5a6a"/>
      <stop offset="50%" stop-color="#2a3a4a"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>
    <radialGradient id="dialGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3a4a5a"/>
      <stop offset="60%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </radialGradient>
    <filter id="deepShadow">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.95"/>
    </filter>
    <filter id="innerShadow">
      <feFlood flood-color="#000" flood-opacity="0.6" result="flood"/>
      <feComposite in="flood" in2="SourceGraphic" operator="in" result="mask"/>
      <feGaussianBlur in="mask" stdDeviation="5"/>
    </filter>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="30%" stop-color="#e8eef4"/>
      <stop offset="60%" stop-color="#909aa8"/>
      <stop offset="100%" stop-color="#6a7888"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Floor reflection -->
  <ellipse cx="200" cy="385" rx="140" ry="15" fill="#1a2530" opacity="0.5"/>

  <!-- Vault body -->
  <g filter="url(#deepShadow)">
    <rect x="42" y="55" width="316" height="290" rx="8" fill="url(#steelDark)"/>
    <rect x="44" y="57" width="312" height="286" rx="7" fill="url(#steel)"/>

    <!-- Rivets/bolts -->
    <g fill="url(#chrome)" stroke="#3a4a5a" stroke-width="1">
      <circle cx="65" cy="80" r="7"/>
      <circle cx="335" cy="80" r="7"/>
      <circle cx="65" cy="320" r="7"/>
      <circle cx="335" cy="320" r="7"/>
      <circle cx="65" cy="200" r="7"/>
      <circle cx="335" cy="200" r="7"/>
    </g>
    <!-- Rivet centers -->
    <g fill="#8a9aaa">
      <circle cx="65" cy="80" r="3"/>
      <circle cx="335" cy="80" r="3"/>
      <circle cx="65" cy="320" r="3"/>
      <circle cx="335" cy="320" r="3"/>
      <circle cx="65" cy="200" r="3"/>
      <circle cx="335" cy="200" r="3"/>
    </g>

    <!-- Hinge left -->
    <rect x="38" y="110" width="14" height="40" rx="3" fill="url(#chrome)" stroke="#3a4a5a" stroke-width="1"/>
    <circle cx="45" cy="118" r="4" fill="#6a7888"/>
    <circle cx="45" cy="142" r="4" fill="#6a7888"/>

    <rect x="38" y="250" width="14" height="40" rx="3" fill="url(#chrome)" stroke="#3a4a5a" stroke-width="1"/>
    <circle cx="45" cy="258" r="4" fill="#6a7888"/>
    <circle cx="45" cy="282" r="4" fill="#6a7888"/>

    <!-- Brand plate -->
    <rect x="90" y="65" width="140" height="28" rx="3" fill="#1a2530" stroke="#3a5070" stroke-width="1"/>
    <text x="160" y="83" font-family="Arial" font-size="12" fill="#4a7aaa" text-anchor="middle" letter-spacing="3" font-weight="bold">FORTRESS</text>

    <!-- Main dial housing -->
    <circle cx="210" cy="210" r="112" fill="#1a2530" stroke="#2a3a4a" stroke-width="3"/>
    <circle cx="210" cy="210" r="108" fill="url(#dialGrad)"/>
    <circle cx="210" cy="210" r="104" fill="none" stroke="#3a5070" stroke-width="1.5"/>

    <!-- Dial ring markers -->
    <circle cx="210" cy="210" r="98" fill="none" stroke="#2a4060" stroke-width="8"/>

    <!-- Number markers on dial -->
    <g font-family="Arial" font-size="11" fill="#7aaad0" text-anchor="middle" font-weight="bold">
      <text x="210" y="120">0</text>
      <text x="268" y="138">5</text>
      <text x="302" y="195">10</text>
      <text x="284" y="260">15</text>
      <text x="233" y="305">20</text>
      <text x="172" y="305">25</text>
      <text x="126" y="260">30</text>
      <text x="112" y="195">35</text>
      <text x="144" y="136">40</text>
      <text x="192" y="120">45</text>
    </g>

    <!-- Tick marks -->
    <g stroke="#4a6a8a" stroke-width="2">
      <line x1="210" y1="114" x2="210" y2="124" transform="rotate(0 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="122" transform="rotate(36 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="124" transform="rotate(72 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="122" transform="rotate(108 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="124" transform="rotate(144 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="122" transform="rotate(180 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="124" transform="rotate(216 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="122" transform="rotate(252 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="124" transform="rotate(288 210 210)"/>
      <line x1="210" y1="114" x2="210" y2="122" transform="rotate(324 210 210)"/>
    </g>

    <!-- Inner dial -->
    <circle cx="210" cy="210" r="60" fill="#0d1520" stroke="#2a4060" stroke-width="2"/>
    <circle cx="210" cy="210" r="55" fill="#0a1018"/>

    <!-- Dial indicator line -->
    <line x1="210" y1="210" x2="210" y2="162" stroke="#5a9ad0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="210" cy="210" r="6" fill="#2a4060" stroke="#5a9ad0" stroke-width="1.5"/>

    <!-- Handle spokes -->
    <g stroke="url(#chrome)" stroke-width="6" stroke-linecap="round">
      <line x1="210" y1="210" x2="210" y2="175"/>
      <line x1="210" y1="210" x2="239" y2="227"/>
      <line x1="210" y1="210" x2="181" y2="227"/>
    </g>
    <circle cx="210" cy="210" r="12" fill="url(#chrome)"/>
    <circle cx="210" cy="210" r="6" fill="#2a3a4a"/>

    <!-- Handle bar -->
    <rect x="310" y="198" width="32" height="24" rx="8" fill="url(#chrome)" stroke="#5a6a7a" stroke-width="1"/>

    <!-- Lock bolts right side -->
    <rect x="354" y="130" width="12" height="22" rx="3" fill="url(#chrome)" stroke="#3a4a5a" stroke-width="1"/>
    <rect x="354" y="190" width="12" height="22" rx="3" fill="url(#chrome)" stroke="#3a4a5a" stroke-width="1"/>
    <rect x="354" y="250" width="12" height="22" rx="3" fill="url(#chrome)" stroke="#3a4a5a" stroke-width="1"/>

    <!-- Keyhole -->
    <circle cx="145" cy="210" r="14" fill="#0a1018" stroke="#2a3a4a" stroke-width="1.5"/>
    <circle cx="145" cy="205" r="6" fill="#1a2530"/>
    <rect x="142" y="208" width="6" height="12" rx="1" fill="#1a2530"/>

    <!-- Steel surface texture / reflection -->
    <path d="M50 65 Q80 60 100 70" stroke="#9aaabb" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M50 100 Q90 94 130 100" stroke="#9aaabb" stroke-width="1" fill="none" opacity="0.2"/>
  </g>
</svg>
