<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#050300"/>
    </radialGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c080"/>
      <stop offset="25%" stop-color="#f0e0a0"/>
      <stop offset="50%" stop-color="#c8b060"/>
      <stop offset="75%" stop-color="#e8d080"/>
      <stop offset="100%" stop-color="#a08040"/>
    </linearGradient>
    <radialGradient id="dialBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="strapTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="20%" stop-color="#4a3018"/>
      <stop offset="50%" stop-color="#3a2010"/>
      <stop offset="80%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1a08"/>
    </linearGradient>
    <linearGradient id="strapBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#221508"/>
      <stop offset="20%" stop-color="#3a2510"/>
      <stop offset="50%" stop-color="#2a1808"/>
      <stop offset="80%" stop-color="#3a2510"/>
      <stop offset="100%" stop-color="#221508"/>
    </linearGradient>
    <filter id="caseShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="crystal" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Strap top -->
  <path d="M148 40 L252 40 L262 68 L255 140 L145 140 L138 68Z" fill="url(#strapTop)"/>
  <!-- Strap texture lines -->
  <line x1="150" y1="55" x2="250" y2="55" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="68" x2="250" y2="68" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="81" x2="250" y2="81" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="94" x2="250" y2="94" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="107" x2="250" y2="107" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="120" x2="250" y2="120" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <!-- Strap holes -->
  <ellipse cx="200" cy="58" rx="4" ry="3" fill="#1a0a04" stroke="#3a2010" stroke-width="0.8"/>
  <ellipse cx="200" cy="75" rx="4" ry="3" fill="#1a0a04" stroke="#3a2010" stroke-width="0.8"/>
  <ellipse cx="200" cy="92" rx="4" ry="3" fill="#1a0a04" stroke="#3a2010" stroke-width="0.8"/>

  <!-- Strap bottom -->
  <path d="M145 260 L255 260 L262 332 L252 360 L148 360 L138 332Z" fill="url(#strapBot)"/>
  <line x1="150" y1="275" x2="250" y2="275" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="290" x2="250" y2="290" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="305" x2="250" y2="305" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="320" x2="250" y2="320" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <line x1="150" y1="335" x2="250" y2="335" stroke="#5a3a18" stroke-width="0.8" opacity="0.6"/>
  <!-- Buckle -->
  <rect x="178" y="346" width="44" height="10" rx="3" fill="#c8a840" stroke="#e0c060" stroke-width="1"/>
  <line x1="200" y1="346" x2="200" y2="356" stroke="#a08030" stroke-width="1.5"/>

  <!-- Watch case outer -->
  <circle cx="200" cy="200" r="132" fill="url(#caseGrad)" filter="url(#caseShadow)"/>
  <!-- Case side chamfer -->
  <circle cx="200" cy="200" r="126" fill="#c0a050"/>
  <!-- Inner bezel -->
  <circle cx="200" cy="200" r="120" fill="#1a1a1a"/>

  <!-- Bezel numerals -->
  <text x="200" y="96" font-family="Arial" font-size="12" fill="#c8a840" text-anchor="middle" font-weight="bold">12</text>
  <text x="304" y="204" font-family="Arial" font-size="12" fill="#c8a840" text-anchor="middle" font-weight="bold">3</text>
  <text x="200" y="318" font-family="Arial" font-size="12" fill="#c8a840" text-anchor="middle" font-weight="bold">6</text>
  <text x="97" y="204" font-family="Arial" font-size="12" fill="#c8a840" text-anchor="middle" font-weight="bold">9</text>

  <!-- Dial face -->
  <circle cx="200" cy="200" r="112" fill="url(#dialBg)"/>

  <!-- Minute track -->
  <circle cx="200" cy="200" r="105" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Hour markers -->
  <g fill="#e8d080">
    <!-- 12 -->
    <rect x="196" y="98" width="8" height="18" rx="1"/>
    <!-- 3 -->
    <rect x="284" y="196" width="18" height="8" rx="1"/>
    <!-- 6 -->
    <rect x="196" y="284" width="8" height="18" rx="1"/>
    <!-- 9 -->
    <rect x="98" y="196" width="18" height="8" rx="1"/>
  </g>
  <!-- Smaller hour markers -->
  <g fill="#888" stroke="none">
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(30 200 200)"/>
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(60 200 200)"/>
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(120 200 200)"/>
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(150 200 200)"/>
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(210 200 200)"/>
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(240 200 200)"/>
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(300 200 200)"/>
    <rect x="197" y="98" width="3" height="10" rx="0.5" transform="rotate(330 200 200)"/>
  </g>

  <!-- Sub-dial at 6 (seconds) -->
  <circle cx="200" cy="268" r="22" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="200" cy="268" r="18" fill="#0a0a0a"/>
  <line x1="200" y1="268" x2="200" y2="252" stroke="#e0c060" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="296" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">SECONDS</text>

  <!-- Date window -->
  <rect x="232" y="194" width="28" height="18" rx="2" fill="#fff" stroke="#444" stroke-width="1"/>
  <text x="246" y="207" font-family="Arial" font-size="11" fill="#111" text-anchor="middle" font-weight="bold">17</text>

  <!-- Brand text -->
  <text x="200" y="158" font-family="Georgia,serif" font-size="14" fill="#c8a840" text-anchor="middle" letter-spacing="3" font-weight="bold">ROLEX</text>
  <text x="200" y="174" font-family="Arial" font-size="8" fill="#888" text-anchor="middle" letter-spacing="2">OYSTER PERPETUAL</text>

  <!-- Hour hand -->
  <path d="M197 200 L196 130 L200 118 L204 130 L203 200Z" fill="#e8e8e8"/>
  <path d="M197 200 L196 130 L200 118 L204 130 L203 200Z" fill="url(#caseGrad)" opacity="0.3"/>

  <!-- Minute hand -->
  <path d="M199 200 L198 108 L200 100 L202 108 L201 200Z" fill="#e8e8e8"/>

  <!-- Second hand -->
  <line x1="200" y1="225" x2="200" y2="108" stroke="#e03000" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="220" r="6" fill="none" stroke="#e03000" stroke-width="2"/>

  <!-- Center cap -->
  <circle cx="200" cy="200" r="8" fill="url(#caseGrad)"/>
  <circle cx="200" cy="200" r="4" fill="#f0e0a0"/>

  <!-- Crystal reflection -->
  <circle cx="200" cy="200" r="112" fill="url(#crystal)"/>
  <path d="M130 135 Q160 120 190 128" stroke="white" stroke-width="3" fill="none" opacity="0.12" stroke-linecap="round"/>

  <!-- Crown -->
  <rect x="330" y="190" width="16" height="20" rx="5" fill="url(#caseGrad)" stroke="#a08030" stroke-width="1"/>
  <rect x="332" y="193" width="12" height="4" rx="1" fill="#e0c060" opacity="0.5"/>
  <rect x="332" y="200" width="12" height="4" rx="1" fill="#e0c060" opacity="0.5"/>
</svg>
