<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="50" fill="#0a0a0f"/>
  <!-- Strap top -->
  <rect x="40" y="8" width="20" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="42" y="10" width="16" height="18" rx="3" fill="#222"/>
  <!-- Strap holes -->
  <circle cx="50" cy="14" r="1.2" fill="#111"/>
  <circle cx="50" cy="19" r="1.2" fill="#111"/>
  <circle cx="50" cy="24" r="1.2" fill="#111"/>
  <!-- Strap bottom -->
  <rect x="40" y="70" width="20" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="42" y="72" width="16" height="18" rx="3" fill="#222"/>
  <circle cx="50" cy="76" r="1.2" fill="#111"/>
  <circle cx="50" cy="81" r="1.2" fill="#111"/>
  <circle cx="50" cy="86" r="1.2" fill="#111"/>
  <!-- Case outer -->
  <circle cx="50" cy="50" r="25" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- Case bezel -->
  <circle cx="50" cy="50" r="23" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="0.8"/>
  <!-- Minute markers -->
  <circle cx="50" cy="29" r="1" fill="#888"/>
  <circle cx="50" cy="71" r="1" fill="#888"/>
  <circle cx="29" cy="50" r="1" fill="#888"/>
  <circle cx="71" cy="50" r="1" fill="#888"/>
  <!-- Hour markers small -->
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(30 50 50)"/>
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(60 50 50)"/>
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(120 50 50)"/>
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(150 50 50)"/>
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(210 50 50)"/>
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(240 50 50)"/>
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(300 50 50)"/>
  <rect x="55.5" y="28.5" width="1" height="3" rx="0.5" fill="#666" transform="rotate(330 50 50)"/>
  <!-- Dial -->
  <circle cx="50" cy="50" r="18" fill="#0d0d1a"/>
  <!-- Date window -->
  <rect x="57" y="48" width="7" height="5" rx="0.5" fill="#fff" stroke="#333" stroke-width="0.3"/>
  <text x="60.5" y="52" font-family="Arial" font-size="3.5" fill="#111" text-anchor="middle" font-weight="bold">23</text>
  <!-- Hour hand -->
  <line x1="50" y1="50" x2="50" y2="36" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="50" y1="50" x2="62" y2="43" stroke="#e8e8e8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="50" y1="50" x2="42" y2="66" stroke="#e53935" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="52" y2="42" stroke="#e53935" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Center -->
  <circle cx="50" cy="50" r="2" fill="#c8a000"/>
  <circle cx="50" cy="50" r="1" fill="#ffd700"/>
  <!-- Crown -->
  <rect x="73" y="47" width="4" height="6" rx="1.5" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="0.5"/>
</svg>
