<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="50" fill="#0d0a00"/>
  <!-- Chain links - gold Cuban link style -->
  <!-- Row 1 -->
  <ellipse cx="38" cy="38" rx="8" ry="5" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="38" cy="38" rx="8" ry="5" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <ellipse cx="62" cy="38" rx="8" ry="5" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="62" cy="38" rx="8" ry="5" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <!-- Row 2 - vertical links -->
  <ellipse cx="50" cy="44" rx="5" ry="8" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="50" cy="44" rx="5" ry="8" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <!-- Row 3 -->
  <ellipse cx="34" cy="52" rx="8" ry="5" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="34" cy="52" rx="8" ry="5" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <ellipse cx="66" cy="52" rx="8" ry="5" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="66" cy="52" rx="8" ry="5" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <!-- Row 4 - vertical -->
  <ellipse cx="50" cy="58" rx="5" ry="8" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="50" cy="58" rx="5" ry="8" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <!-- Row 5 -->
  <ellipse cx="38" cy="66" rx="8" ry="5" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="38" cy="66" rx="8" ry="5" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <ellipse cx="62" cy="66" rx="8" ry="5" fill="none" stroke="#c8860a" stroke-width="3.5"/>
  <ellipse cx="62" cy="66" rx="8" ry="5" fill="none" stroke="#f0a820" stroke-width="1.5"/>
  <!-- Shine highlights -->
  <ellipse cx="34" cy="50" rx="2.5" ry="1" fill="#ffd700" opacity="0.6"/>
  <ellipse cx="66" cy="50" rx="2.5" ry="1" fill="#ffd700" opacity="0.6"/>
  <ellipse cx="48" cy="42" rx="1" ry="2.5" fill="#ffd700" opacity="0.6"/>
  <ellipse cx="52" cy="60" rx="1" ry="2.5" fill="#ffd700" opacity="0.6"/>
</svg>
